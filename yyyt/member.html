  <link rel="stylesheet" href="style.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei", SimHei, sans-serif;
    }

    html, body {
      min-height: 100vh;
    }

    body {
      background: #0b1220 url("images/background.png") center / cover no-repeat;
      background-attachment: fixed;
      color: #e6f0f8;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(5, 12, 24, 0.45), rgba(5, 12, 24, 0.65));
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 20px;
      text-align: center;
    }

    .logo-text {
      margin-bottom: 30px;
    }

    .main-title {
      font-family: "FangSong", "仿宋", serif !important;
      font-size: clamp(3rem, 8vw, 6.5rem);
      font-weight: normal;
      color: #f4fbff;
      letter-spacing: 14px;
      padding-left: 14px;
      text-shadow:
        0 0 10px rgba(120, 180, 220, 0.9),
        0 0 22px rgba(80, 140, 190, 0.6),
        0 0 35px rgba(212, 175, 87, 0.35),
        2px 2px 0 rgba(9, 18, 32, 0.95);
    }

    .sub-title {
      font-size: clamp(1.3rem, 3vw, 2rem);
      color: #ffd97a;
      margin-top: 14px;
      letter-spacing: 8px;
      text-shadow:
        0 0 8px rgba(212, 175, 87, 0.5),
        0 2px 0 rgba(0, 0, 0, 0.6);
    }

    .en-text {
      margin-top: 10px;
      color: #b9d5e8;
      letter-spacing: 5px;
      font-size: 0.95rem;
      opacity: 0.9;
    }

    nav {
      margin: 50px 0;
    }

    nav a {
      display: inline-block;
      text-decoration: none;
      color: #eaf6ff;
      font-size: 1.1rem;
      padding: 12px 28px;
      margin: 8px;
      border: 1px solid rgba(255, 215, 120, 0.35);
      border-radius: 999px;
      background: rgba(10, 22, 40, 0.35);
      backdrop-filter: blur(6px);
      transition: 0.3s ease;
    }

    nav a:hover {
      background: rgba(212, 175, 87, 0.18);
      border-color: rgba(255, 215, 120, 0.55);
      box-shadow: 0 0 18px rgba(212, 175, 87, 0.35);
      color: #fff;
    }

    nav a.active {
      background: rgba(212, 175, 87, 0.22);
      border-color: rgba(255, 215, 120, 0.6);
    }

    .member-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 60px;
    }

    .member-card {
      display: flex;
      align-items: center;
      gap: 18px;
      background: rgba(10, 22, 40, 0.32);
      border: 1px solid rgba(255, 215, 120, 0.25);
      border-radius: 18px;
      padding: 16px 18px;
      backdrop-filter: blur(6px);
      transition: 0.3s ease;
      text-align: left;
    }

    .member-card:hover {
      border-color: rgba(255, 215, 120, 0.45);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35),
        0 0 14px rgba(212, 175, 87, 0.18);
    }

    .member-avatar {
      width: 90px;
      height: 90px;
      border-radius: 16px;
      flex-shrink: 0;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 215, 120, 0.3);
    }

    .member-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .member-info {
      flex: 1;
      min-width: 0;
    }

    .member-info h3 {
      color: #ffd97a;
      margin-bottom: 8px;
      font-size: 1.2rem;
      letter-spacing: 4px;
    }

    .member-info p {
      color: #d7e9f7;
      line-height: 1.7;
      font-size: 0.98rem;
    }

    footer {
      margin-top: 80px;
      padding-top: 24px;
      border-top: 1px solid rgba(170, 210, 240, 0.18);
      color: #9cbbd6;
      font-size: 0.9rem;
      letter-spacing: 2px;
    }
  </style>
</head>
