<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我们的照片 | 遥遥玉台 · 燕云十六声</title>
  <link rel="stylesheet" href="style.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei", SimHei, sans-serif;
    }

    html, body {
      min-height: 100vh;
    }

    body {
      background: #0b1220 url("images/background.png") center / cover no-repeat;
      background-attachment: fixed;
      color: #e6f0f8;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(5, 12, 24, 0.45), rgba(5, 12, 24, 0.65));
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 20px;
      text-align: center;
    }

    .logo-text {
      margin-bottom: 30px;
    }

    .main-title {
      font-family: "FangSong", "仿宋", serif !important;
      font-size: clamp(3rem, 8vw, 6.5rem);
      font-weight: normal;
      color: #f4fbff;
      letter-spacing: 14px;
      padding-left: 14px;
      text-shadow:
        0 0 10px rgba(120, 180, 220, 0.9),
        0 0 22px rgba(80, 140, 190, 0.6),
        0 0 35px rgba(212, 175, 87, 0.35),
        2px 2px 0 rgba(9, 18, 32, 0.95);
    }

    .sub-title {
      font-size: clamp(1.3rem, 3vw, 2rem);
      color: #ffd97a;
      margin-top: 14px;
      letter-spacing: 8px;
      text-shadow:
        0 0 8px rgba(212, 175, 87, 0.5),
        0 2px 0 rgba(0, 0, 0, 0.6);
    }

    .en-text {
      margin-top: 10px;
      color: #b9d5e8;
      letter-spacing: 5px;
      font-size: 0.95rem;
      opacity: 0.9;
    }

    nav {
      margin: 50px 0;
    }

    nav a {
      display: inline-block;
      text-decoration: none;
      color: #eaf6ff;
      font-size: 1.1rem;
      padding: 12px 28px;
      margin: 8px;
      border: 1px solid rgba(255, 215, 120, 0.35);
      border-radius: 999px;
      background: rgba(10, 22, 40, 0.35);
      backdrop-filter: blur(6px);
      transition: 0.3s ease;
    }

    nav a:hover {
      background: rgba(212, 175, 87, 0.18);
      border-color: rgba(255, 215, 120, 0.55);
      box-shadow: 0 0 18px rgba(212, 175, 87, 0.35);
      color: #fff;
    }

    nav a.active {
      background: rgba(212, 175, 87, 0.22);
      border-color: rgba(255, 215, 120, 0.6);
    }

    .album-section {
      margin-top: 50px;
      text-align: left;
    }

    .album-title {
      color: #ffd97a;
      font-size: 1.3rem;
      letter-spacing: 4px;
      margin-bottom: 16px;
      padding-left: 8px;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .photo-item {
      border-radius: 18px;
      border: 1px solid rgba(255, 215, 120, 0.25);
      overflow: hidden;
      background: rgba(10, 22, 40, 0.32);
      backdrop-filter: blur(6px);
      transition: 0.3s ease;
    }

    .photo-item:hover {
      transform: translateY(-6px);
      border-color: rgba(255, 215, 120, 0.45);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35),
        0 0 14px rgba(212, 175, 87, 0.18);
    }

    .photo-item img {
      width: 100%;
      display: block;
    }

    .photo-item p {
      padding:14px;
      color: #d7e9f7;
      font-size:0.95rem;
    }

    footer {
      margin-top: 80px;
      padding-top: 24px;
      border-top: 1px solid rgba(170, 210, 240, 0.18);
      color: #9cbbd6;
      font-size: 0.9rem;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-text">
      <h1 class="main-title">我们的照片</h1>
      <div class="sub-title">遥遥玉台 · 燕云十六声</div>
      <div class="en-text">GALLERY</div>
    </div>

    <nav>
      <a href="index.html">首页</a>
      <a href="about.html">关于我们</a>
      <a href="member.html">成员简介</a>
      <a href="photo.html" class="active">我们的照片</a>
      <a href="join.html">加入我们</a>
    </nav>

    <!-- 风景合集 -->
    <div class="album-section">
      <h3 class="album-title">山河风物 · 风景</h3>
      <div class="photo-grid">
        <div class="photo-item">
          <img src="images/scenery1.jpg" alt="风景">
          <p>山月远景</p>
        </div>
        <div class="photo-item">
          <img src="images/scenery2.jpg" alt="风景">
          <p>江畔暮色</p>
        </div>
      </div>
    </div>

    <!-- 人像合集 -->
    <div class="album-section">
      <h3 class="album-title">侠影留踪 · 人像</h3>
      <div class="photo-grid">
        <div class="photo-item">
          <img src="images/portrait1.jpg" alt="人像">
          <p>江湖侠影</p>
        </div>
        <div class="photo-item">
          <img src="images/portrait2.jpg" alt="人像">
          <p>月下凭栏</p>
        </div>
      </div>
    </div>

    <!-- 全景合集 -->
    <div class="album-section">
      <h3 class="album-title">盛景同游 · 全景</h3>
      <div class="photo-grid">
        <div class="photo-item">
          <img src="images/pano1.jpg" alt="全景">
          <p>群侠相聚</p>
        </div>
        <div class="photo-item">
          <img src="images/pano2.jpg" alt="全景">
          <p>长街全景</p>
        </div>
      </div>
    </div>

    <footer>
      © 遥遥玉台 · 燕云十六声
    </footer>
  </div>
</body>
</html>
